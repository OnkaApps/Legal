<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uygulama Yasal Sayfaları</title>
  <style>
    :root { --bg:#ffffff; --text:#1a1a2e; --muted:#5a5a72; --accent:#4361ee; --card:#f4f5fb; --border:#e4e6f1; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7; color: var(--text); background: var(--bg);
      max-width: 680px; margin: 0 auto; padding: 40px 20px 80px;
    }
    h1 { font-size: 1.8rem; }
    p.intro { color: var(--muted); }
    .app {
      display: block; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 22px; margin: 16px 0; text-decoration: none; color: var(--text);
      transition: border-color .15s;
    }
    .app:hover { border-color: var(--accent); }
    .app h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .app span { color: var(--accent); font-size: 0.9rem; }
    .soon { opacity: 0.5; }
    .footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Yasal Belgeler</h1>
  <p class="intro">Uygulamalarımızın gizlilik politikaları ve kullanım koşulları.</p>

  <a class="app" href="siecast/privacy.html">
    <h2>Siecast</h2>
    <span>Gizlilik Politikası → · <a href="siecast/terms.html" style="color:#4361ee">Kullanım koşulları →</a></span>
  </a>

  <!-- Diğer 3 uygulama hazır olunca aşağıdaki şablonu kopyalayıp doldur: -->
  <div class="app soon">
    <h2>Uygulama 2</h2>
    <span>Yakında</span>
  </div>
  <div class="app soon">
    <h2>Uygulama 3</h2>
    <span>Yakında</span>
  </div>
  <div class="app soon">
    <h2>Uygulama 4</h2>
    <span>Yakında</span>
  </div>

  <div class="footer">
    İletişim: <a href="mailto:onkaapps.destek@gmail.com">onkaapps.destek@gmail.com</a>
  </div>
</body>
</html>
